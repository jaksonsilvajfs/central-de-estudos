<style>
/* Layout: pauta da disciplina (temas e trabalhos) na lateral, mesa de estudo à direita. */
:root {
  --bg: #ECEEF2;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --ink: #16213A;
  --muted: #58627A;
  --line: #D3D8E2;
  --primary: #1B2B5A;
  --on-primary: #FFFFFF;
  --accent: #8A5E0B;
  --accent-soft: #F3E7CC;
  --good: #1D7448;
  --good-soft: #DDF0E5;
  --warn: #A85A07;
  --warn-soft: #FBE8D0;
  --bad: #B3261E;
  --bad-soft: #F8DCDA;
  --focus: #2E5BFF;
  --f-display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #161D32; --surface-2: #1C2540; --ink: #E7EAF3; --muted: #9AA3BA; --line: #2A3453;
    --primary: #A5B8FF; --on-primary: #0E1322; --accent: #E3B65A; --accent-soft: #3A2F14;
    --good: #5CCB92; --good-soft: #12301F; --warn: #F0A458; --warn-soft: #3A2410; --bad: #FF8F86; --bad-soft: #3F1A18;
    --focus: #8FA8FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #161D32; --surface-2: #1C2540; --ink: #E7EAF3; --muted: #9AA3BA; --line: #2A3453;
  --primary: #A5B8FF; --on-primary: #0E1322; --accent: #E3B65A; --accent-soft: #3A2F14;
  --good: #5CCB92; --good-soft: #12301F; --warn: #F0A458; --warn-soft: #3A2410; --bad: #FF8F86; --bad-soft: #3F1A18;
  --focus: #8FA8FF; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Cabeçalho */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); margin-bottom: 20px; }
.kicker { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 4.6vw, 32px); line-height: 1.15; margin: 0; text-wrap: balance; }
.status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.status.warn::before { background: var(--warn); }
.status.bad::before { background: var(--bad); }
.status.bad { color: var(--bad); }

/* Estrutura */
.layout { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.rail h2, .label { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
.home-link { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: var(--primary); }
.home-link[aria-current="true"] { text-decoration: underline; text-underline-offset: 4px; }
.rev-count { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
.rev-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rev-row:first-child { border-top: 0; padding-top: 0; }
.rev-row b { font-weight: 600; overflow-wrap: anywhere; }
.rev-row .q-meta { margin-top: 4px; }
@media (max-width: 520px) { .rev-row { grid-template-columns: minmax(0, 1fr); } }
details.fold { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
details.fold summary { cursor: pointer; font-weight: 600; }
details.fold[open] summary { margin-bottom: 12px; }
.mat-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: end; }
.mat-form .wide { grid-column: 1 / -1; }
@media (max-width: 620px) { .mat-form { grid-template-columns: minmax(0, 1fr); } }
.mat-link { font-weight: 600; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
.mat-link:hover { text-decoration-thickness: 2px; }
.host { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
a.btn { text-decoration: none; display: inline-block; }
.chat { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 6px; }
.chat-log { display: grid; gap: 12px; }
.msg { display: grid; gap: 4px; min-width: 0; max-width: 78ch; }
.msg-who { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.msg-user { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.msg-user .q-text { margin: 0; }
.msg-bot { border-left: 3px solid var(--accent); padding-left: 12px; }
.monitor .chat-log { max-height: 460px; overflow-y: auto; padding-right: 4px; }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; border-radius: 99px; padding: 10px 18px; box-shadow: 0 6px 18px rgba(10, 16, 32, .22); }
.quote { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-width: 70ch; }

.items { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; }
.item { width: 100%; text-align: left; background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 9px 10px; cursor: pointer; display: grid; gap: 2px; }
.item:hover { border-color: var(--line); }
.item[aria-current="true"] { border-color: var(--primary); background: var(--surface); box-shadow: inset 3px 0 0 var(--primary); }
.item b { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.item small { color: var(--muted); font-size: 12.5px; }
.rail-empty { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }

/* Controles */
label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
input[type="text"], input[type="date"], textarea, select {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; color: var(--ink);
}
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
.btn { background: var(--primary); color: var(--on-primary); border: 1px solid var(--primary); border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--muted); filter: none; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }

/* Mesa */
.mesa { min-width: 0; display: grid; gap: 14px; }
.mesa-head { display: grid; gap: 10px; }
.title-input { font-family: var(--f-display); font-size: clamp(20px, 3.6vw, 26px); font-weight: 700; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 4px 0; background: transparent; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }

.pill { display: inline-block; font-family: var(--f-mono); font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 10px; justify-items: start; background: var(--surface); }
.empty h3 { margin: 0; font-family: var(--f-display); font-size: 19px; }
.empty p { margin: 0; color: var(--muted); max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.chip:hover { border-color: var(--primary); }
.chip[aria-current="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.chip-n { font-family: var(--f-mono); font-size: 11.5px; opacity: .75; margin-left: 4px; }
.tagchip { display: inline-flex; align-items: center; border: 1px solid transparent; background: var(--accent-soft); color: var(--accent); border-radius: 99px; overflow: hidden; }
.tag-go, .tag-x { background: none; border: 0; cursor: pointer; color: inherit; font-size: 13px; padding: 4px 8px; }
.tag-go { padding-right: 4px; font-weight: 500; }
.tag-x { padding-left: 4px; font-size: 16px; line-height: 1; }
.tag-go:hover, .tag-x:hover { text-decoration: underline; }

.note { border-radius: 6px; padding: 10px 12px; font-size: 13.5px; background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }

/* Texto gerado */
.prose { max-width: 70ch; overflow-wrap: anywhere; }
.prose h3 { font-family: var(--f-display); font-size: 18px; margin: 20px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); text-wrap: balance; }
.prose h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.prose h4 { font-size: 15px; margin: 14px 0 4px; }
.prose p { margin: 0 0 10px; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 22px; }
.prose li { margin-bottom: 4px; }
.prose code { font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }

/* Painel */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 0; }
.facts div { border-left: 3px solid var(--accent); padding-left: 10px; }
.facts dt { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Perguntas */
.q { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.q-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fb { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.fb p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: no-preference) { .item, .btn, .chip { transition: border-color .15s, filter .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="kicker">1º período · Direito</p>
      <h1>Disciplina: Instituições Judiciais e Ética</h1>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Carregando…</div>
  </header>

  <div class="layout">
    <aside class="rail">
      <section class="panel">
        <button id="home-link" class="home-link" type="button">Mesa de estudo</button>
      </section>

      <section class="panel">
        <button id="rev-link" class="home-link" type="button">Revisões</button>
        <small id="rev-count" class="rev-count"></small>
      </section>

      <section class="panel">
        <button id="mat-link" class="home-link" type="button">Materiais de Estudo</button>
        <small id="mat-count" class="rev-count"></small>

      <section class="panel">

      <section class="panel">

    <main id="mesa" class="mesa"></main>

  <button id="fab-monitor" class="btn fab" type="button">Falar com o monitor</button>
</div>

<script>
(function () {
  "use strict";

  /* ---------- utilidades ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };

  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
        else if (k === "value" || k === "checked" || k === "disabled" || k === "hidden") e[k] = v;
        else e.setAttribute(k, v === true ? "" : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (c) {
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return e;
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function inline(text, parent) {
    text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).forEach(function (p) {
      if (!p) return;
      if (p.length > 4 && p.slice(0, 2) === "**" && p.slice(-2) === "**") parent.append(h("strong", { text: p.slice(2, -2) }));
      else if (p.length > 2 && p[0] === "`" && p.slice(-1) === "`") parent.append(h("code", { text: p.slice(1, -1) }));
      else parent.append(document.createTextNode(p));
    });
  }

  function renderMd(src, root) {
    root.textContent = "";
    var list = null, para = [];
    function flushP() {
      if (para.length) { var p = h("p"); inline(para.join(" "), p); root.append(p); para = []; }
    }
    String(src).replace(/\r/g, "").split("\n").forEach(function (raw) {
      var line = raw.trimEnd(), m;
      if (!line.trim()) { flushP(); list = null; return; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        flushP(); list = null;
        var hd = h("h" + Math.min(m[1].length + 1, 4)); inline(m[2], hd); root.append(hd); return;
      }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        flushP();
        if (!list || list.tagName !== "UL") { list = h("ul"); root.append(list); }
        var li = h("li"); inline(m[1], li); list.append(li); return;
      }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        flushP();
        if (!list || list.tagName !== "OL") { list = h("ol"); root.append(list); }
        var li2 = h("li"); inline(m[1], li2); list.append(li2); return;
      }
      list = null; para.push(line.trim());
    });
    flushP();
  }

  function daysLeft(str) {
    if (!str) return null;
    var p = str.split("-").map(Number);
    if (p.length !== 3 || p.some(isNaN)) return null;
    var t = new Date(p[0], p[1] - 1, p[2]);
    var n = new Date(); n.setHours(0, 0, 0, 0);
    return Math.round((t - n) / 864e5);
  }
  function prazoTexto(d) {
    if (d == null) return "sem prazo";
    if (d < -1) return "atrasado há " + (-d) + " dias";
    if (d === -1) return "atrasado há 1 dia";
    if (d === 0) return "vence hoje";
    if (d === 1) return "vence amanhã";
    return "faltam " + d + " dias";
  }
  function dataBR(str) {
    if (!str) return "";
    var p = str.split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : str;
  }
  function fmtNota(n) { return n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }); }

  /* ---------- estado ---------- */
  var state = { temas: [], trabalhos: [], materiais: [], matEdit: null, matFiltro: "", sel: null, tab: "guia", mode: "init", loaded: false, synced: false, saveError: false, slow: false };
  var dbNS = null, sampleFn = null;
  var jobs = {}, jobErr = {}, live = {}, pending = {}, chains = {};
  var LS = "monitor-ije-v1";
  state.geral = { id: "geral", chat: [] };

  function getTema(id) { return state.temas.filter(function (t) { return t.id === id; })[0]; }
  function getTrab(id) { return state.trabalhos.filter(function (t) { return t.id === id; })[0]; }

  function localLoad() {
    try {
      var r = localStorage.getItem(LS);
      if (r) { var d = JSON.parse(r); state.temas = d.temas || []; state.trabalhos = d.trabalhos || []; state.materiais = d.materiais || []; if (d.geral && Array.isArray(d.geral.chat)) state.geral.chat = d.geral.chat; }
    } catch (e) {}
  }
  function localSave() {
    try { localStorage.setItem(LS, JSON.stringify({ temas: state.temas, trabalhos: state.trabalhos, materiais: state.materiais, geral: state.geral })); } catch (e) {}
  }

  function persist(col, item) {
    if (!dbNS) { localSave(); return; }
    var key = col + "/" + item.id;
    var body = JSON.parse(JSON.stringify(item));
    delete body.id;
    chains[key] = (chains[key] || Promise.resolve())
      .then(function () { return dbNS.collection(col).doc(item.id).set(body); })
      .catch(function () { state.saveError = true; renderStatus(); });
  }
  function removeItem(col, id) {
    var arr = col === "temas" ? state.temas : col === "materiais" ? state.materiais : state.trabalhos;
    var i = arr.map(function (x) { return x.id; }).indexOf(id);
    if (i >= 0) arr.splice(i, 1);
    if (!dbNS) { localSave(); return; }
    var key = col + "/" + id;
    chains[key] = (chains[key] || Promise.resolve())
      .then(function () { return dbNS.collection(col).doc(id).delete(); })
      .catch(function () { state.saveError = true; renderStatus(); });
  }

  function debounced(key, fn, ms) {
    clearTimeout(pending[key] && pending[key].t);
    pending[key] = { fn: fn, t: setTimeout(function () { var p = pending[key]; delete pending[key]; p.fn(); }, ms || 600) };
  }
  function flushAll() {
    Object.keys(pending).forEach(function (k) {

  /* ---------- status ---------- */
  function renderStatus() {
    var s = $("#status"), txt, cls = "status";
    if (state.saveError) { txt = "Não foi possível salvar. A página pode estar em modo somente leitura."; cls += " bad"; }
    else if (state.mode === "init") { txt = "Carregando…"; cls += " warn"; }
    else if (state.mode === "db") {
      if (!state.synced) { txt = state.slow ? "Sem resposta do armazenamento. Os dados podem estar desatualizados." : "Carregando seus temas…"; cls += " warn"; }
      else txt = "Tudo salvo nesta página";
    } else { txt = "Salvo só neste navegador"; cls += " warn"; }
    s.className = cls; s.textContent = txt;
  }

      prompt_too_large: "O texto é grande demais. Reduza as anotações e tente de novo."

  /* ---------- tarefas com o Claude ---------- */
  function paintLive(key) {
    var n = live[key];
    if (n && n.isConnected && jobs[key]) {
      if (jobs[key].text) renderMd(jobs[key].text, n);
    }
  }
  function stopJob(key) { if (jobs[key]) jobs[key].ctl.abort(); }

  function finishUI() { renderRail(); renderMain(true); }

  function startStream(key, prompt, onDone) {
    if (jobs[key] || !sampleFn) return;
    var ctl = new AbortController();
    jobs[key] = { ctl: ctl, text: "" };
    delete jobErr[key];
    renderMain(true);
    sampleFn(prompt, {
      signal: ctl.signal, cache: false,
      onText: function (u) { if (jobs[key]) { jobs[key].text = u.text; paintLive(key); } }
    }).then(function (r) {
      delete jobs[key];
      onDone(r.text, !!r.truncated);
    }).catch(function (e) {
      var partial = e && e.text;
      delete jobs[key];
      if (e && e.code === "cancelled") { if (partial) onDone(partial, true); }
      else { jobErr[key] = copyFor(e && e.code); if (partial) onDone(partial, true); }
    }).then(finishUI);
  }

  function gerarGuia(id) {
    var t = getTema(id); if (!t) return;
    startStream("guia:" + id, promptGuia(t), function (text, cut) {
      var x = getTema(id); if (!x) return;
      x.guia = text; x.guiaCortado = cut; x.guiaEm = Date.now();
      persist("temas", x);
    });
  }
  function promptResumo(t) {
    var erradas = (t.perguntas || []).filter(function (q) { return q.nota != null && q.nota < 7; }).slice(0, 5)
      .map(function (q) { return "- " + q.pergunta.split("\n")[0]; }).join("\n");
    return [
      "Você atua como monitor de uma universidade e prepara um resumo de revisão para um estudante do 1º período de Direito, na disciplina Instituições Judiciais e Ética. O estudante vai reler o resumo em poucos minutos, antes de uma prova ou de uma aula.",
      "",
      "Tema: " + t.titulo,
      "Guia de estudo que o estudante já tem:\n" + (t.guia ? t.guia.slice(0, 8000) : "(nenhum)"),
      "Anotações de aula do estudante:\n" + (t.notas && t.notas.trim() ? t.notas.trim().slice(0, 4000) : "(nenhuma)"),
      erradas ? "Perguntas em que o estudante foi mal. Reforce os pontos ligados a elas:\n" + erradas : "",
      "",
      "Escreva em português do Brasil, em Markdown simples (## para títulos, - para listas, **negrito**), com estas seções:",
      "## Em uma frase",
      "## Os pontos que não podem faltar (no máximo 6 itens)",
      "## Termos e dispositivos para memorizar (cite artigos e leis só quando tiver certeza. Não invente números de artigos, julgados nem autores.)",
      "## Erros comuns",
      "## Duas perguntas-relâmpago (sem gabarito)",
      "Fique fiel ao guia e às anotações, sem contradizer o que o professor disse. Seja breve."

  }
  function gerarResumo(id) {
    var t = getTema(id); if (!t) return;
    startStream("resumo:" + id, promptResumo(t), function (text, cut) {
      var x = getTema(id); if (!x) return;
      x.resumo = text; x.resumoCortado = cut; x.resumoEm = Date.now();
      persist("temas", x);
    });
  }

  function promptChat(t) {
    return [
      "Você é um monitor de universidade e está estudando com um estudante do 1º período de Direito, na disciplina Instituições Judiciais e Ética. Responda em português do Brasil, de forma clara e didática, em respostas curtas ou médias, em Markdown simples (- para listas, **negrito**).",
      "Converse como quem estuda junto: explique, dê exemplos e, quando fizer sentido, termine com uma pergunta para checar se o estudante entendeu.",
      "Não invente números de artigos, julgados, resoluções nem autores. Se não tiver certeza, diga isso e peça ao estudante que confira no texto atualizado e no material do professor.",
      "Se o estudante pedir que você faça um trabalho por ele, oriente o caminho sem entregar texto pronto. Se a pergunta fugir do tema, responda em poucas linhas e traga a conversa de volta ao tema.",
      "",
      "Tema em estudo: " + t.titulo,
      "Guia de estudo do estudante:\n" + (t.guia ? t.guia.slice(0, 6000) : "(ainda não gerado)"),
      "Anotações de aula do estudante:\n" + (t.notas && t.notas.trim() ? t.notas.trim().slice(0, 3000) : "(nenhuma)")
    ].join("\n");
  }

  function enviarChat(id, texto) {
    var key = "chat:" + id, t = getTema(id);
    texto = (texto || "").trim();
    if (!t || jobs[key] || !sampleFn || !texto) return;
    t.chat = (t.chat || []).concat({ role: "user", content: texto.slice(0, 4000) });
    chatDraft[id] = "";
    persist("temas", t);

    var turns = t.chat.slice(-20);
    while (turns.length && turns[0].role !== "user") turns.shift();
    var input = [{ role: "user", content: promptChat(t) }].concat(turns);

    var ctl = new AbortController();
    jobs[key] = { ctl: ctl, text: "" }; delete jobErr[key];
    renderMain(true);

    function devolver() {
      var x = getTema(id);
      if (x && x.chat && x.chat.length && x.chat[x.chat.length - 1].role === "user") {
        chatDraft[id] = x.chat.pop().content; persist("temas", x);
      }
    }
    sampleFn(input, {
      signal: ctl.signal, cache: false,
      onText: function (u) { if (jobs[key]) { jobs[key].text = u.text; paintLive(key); } }
    }).then(function (r) {
      delete jobs[key];
      var x = getTema(id);
      if (x) { x.chat = (x.chat || []).concat({ role: "assistant", content: r.text }).slice(-40); persist("temas", x); }
    }).catch(function (e) {
      var partial = e && e.text;
      delete jobs[key];
      var x = getTema(id);
      if (e && e.code === "cancelled") {
        if (x && partial) { x.chat = (x.chat || []).concat({ role: "assistant", content: partial }); persist("temas", x); }
        else devolver();
      } else {
        jobErr[key] = copyFor(e && e.code);
        if (x && partial) { x.chat = (x.chat || []).concat({ role: "assistant", content: partial }); persist("temas", x); }
        else devolver();
      }
    }).then(finishUI);
  }

  /* ---------- monitor sempre disponível ---------- */
  var monitorLog = null, monIO = null;

  function chatCtx() {
    var s = state.sel;
    if (s && (s.kind === "tema" || s.kind === "rev") && getTema(s.id)) return s.id;
    return "geral";
  }
  function holderFor(ctx) { return ctx === "geral" ? state.geral : getTema(ctx); }
  function saveHolder(ctx) {
    if (ctx === "geral") persist("conversas", state.geral);
    else { var t = getTema(ctx); if (t) persist("temas", t); }
  }

  function promptChatGeral() {
    var temas = state.temas.map(function (t, i) {
      return (i + 1) + ". " + t.titulo + (t.estudado ? " (estudado)" : "") + (t.guia ? " (tem guia)" : "");
    }).join("\n");
    var trabs = state.trabalhos.map(function (w) {
      return "- " + (w.titulo || "Sem título") + " · " + (w.status === "entregue" ? "entregue" : prazoTexto(daysLeft(w.prazo)));
    }).join("\n");
    var atual = state.sel && state.sel.kind === "trab" ? getTrab(state.sel.id) : null;
    return [
      "Você é um monitor de universidade e está estudando com um estudante do 1º período de Direito, na disciplina Instituições Judiciais e Ética. Responda em português do Brasil, de forma clara e didática, em respostas curtas ou médias, em Markdown simples (- para listas, **negrito**).",
      "Converse como quem estuda junto: explique, dê exemplos, ajude a planejar os estudos e, quando fizer sentido, termine com uma pergunta para checar o entendimento.",
      "Não invente números de artigos, julgados, resoluções nem autores. Se não tiver certeza, diga isso e peça ao estudante que confira no texto atualizado e no material do professor.",
      "Se o estudante pedir que você faça um trabalho por ele, oriente o caminho sem entregar texto pronto.",
      "Hoje: " + new Date().toLocaleDateString("pt-BR") + ".",
      "",
      "Temas da pauta do estudante:\n" + (temas || "(nenhum cadastrado)"),
      "Trabalhos:\n" + (trabs || "(nenhum cadastrado)"),
      atual ? "O estudante está com este trabalho aberto: " + (atual.titulo || "Sem título") + "\nOrientação do professor:\n" + (atual.enunciado && atual.enunciado.trim() ? atual.enunciado.trim().slice(0, 4000) : "(não informada)") : ""
    ].join("\n");
  }

  function enviarMonitor(ctx, texto) {
    var key = "chat:" + ctx, hd = holderFor(ctx);
    texto = (texto || "").trim();
    if (!hd || jobs[key] || !sampleFn || !texto) return;
    hd.chat = (hd.chat || []).concat({ role: "user", content: texto.slice(0, 4000) });
    chatDraft[ctx] = "";
    saveHolder(ctx);

    var turns = hd.chat.slice(-20);
    while (turns.length && turns[0].role !== "user") turns.shift();
    var intro = ctx === "geral" ? promptChatGeral() : promptChat(hd);
    var input = [{ role: "user", content: intro }].concat(turns.map(function (m) { return { role: m.role, content: m.content }; }));

    var ctl = new AbortController();
    jobs[key] = { ctl: ctl, text: "" }; delete jobErr[key];
    renderMain(true);

    function anexar(text) {
      var x = holderFor(ctx); if (!x) return;
      x.chat = (x.chat || []).concat({ role: "assistant", content: text }).slice(-40);
      saveHolder(ctx);
    }
    function devolver() {
      var x = holderFor(ctx);
      if (x && x.chat && x.chat.length && x.chat[x.chat.length - 1].role === "user") {
        chatDraft[ctx] = x.chat[x.chat.length - 1].content;
        x.chat = x.chat.slice(0, -1);
        saveHolder(ctx);
      }
    }
    sampleFn(input, {
      signal: ctl.signal, cache: false,
      onText: function (u) {
        if (!jobs[key]) return;
        jobs[key].text = u.text; paintLive(key);
        if (monitorLog && monitorLog.isConnected) monitorLog.scrollTop = monitorLog.scrollHeight;
      }
    }).then(function (r) {
      delete jobs[key];
      anexar(r.text);
    }).catch(function (e) {
      var partial = e && e.text;
      delete jobs[key];
      if (!e || e.code !== "cancelled") jobErr[key] = copyFor(e && e.code);
      if (partial) anexar(partial); else devolver();
    }).then(finishUI);
  }

  function monitorBox(ctx) {
    var key = "chat:" + ctx, j = jobs[key], hd = holderFor(ctx), msgs = (hd && hd.chat) || [];
    var tema = ctx === "geral" ? null : getTema(ctx);
    var trab = !tema && state.sel && state.sel.kind === "trab" ? getTrab(state.sel.id) : null;
    var box = h("section", { class: "panel stack monitor", id: "monitor" });
    box.append(h("div", { class: "row between" },
      h("h2", { class: "label", style: "margin:0", text: "Monitor" }),
      h("span", { class: "pill accent", style: "white-space:normal;overflow-wrap:anywhere", text: tema ? "Tema: " + tema.titulo : trab ? "Trabalho: " + (trab.titulo || "Sem título") : "Conversa geral da disciplina" })));
    if (!msgs.length && !j) {
      box.append(h("p", { class: "muted", style: "margin:0", text: tema
        ? "Pergunte sobre este tema como se estivesse estudando junto. O monitor conhece o seu guia e as suas anotações de aula."
        : "Tire dúvidas sobre a disciplina, peça um plano de estudo ou ajuda para organizar os trabalhos. Ao abrir um tema, a conversa passa a ser sobre ele." }));
    }

    var log = h("div", { class: "chat-log" });
    msgs.forEach(function (m) {
      if (m.role === "user") {
        log.append(h("div", { class: "msg msg-user" }, h("span", { class: "msg-who", text: "Você" }), h("p", { class: "q-text", text: m.content })));
      } else {
        var n = h("div", { class: "prose" }); renderMd(m.content, n);
        log.append(h("div", { class: "msg msg-bot" }, h("span", { class: "msg-who", text: "Monitor" }), n));
      }
    });
    if (j) {
      var ln = h("div", { class: "prose" }); live[key] = ln;
      if (j.text) renderMd(j.text, ln); else ln.append(h("p", { class: "muted", text: "Pensando…" }));
      log.append(h("div", { class: "msg msg-bot" }, h("span", { class: "msg-who", text: "Monitor" }), ln));
    }
    monitorLog = null;
    if (msgs.length || j) {
      box.append(log); monitorLog = log;
      requestAnimationFrame(function () { log.scrollTop = log.scrollHeight; });
    }
    if (jobErr[key]) box.append(h("div", { class: "note bad", role: "alert", text: jobErr[key] }));
    if (!sampleFn) box.append(h("div", { class: "note", text: NO_CLAUDE }));

    if (!msgs.length && !j && sampleFn) {
      var sugs = tema
        ? ["Explique este tema com um exemplo", "O que costuma cair em prova sobre isso?", "Me teste com uma pergunta"]
        : ["Monte um plano de estudo para esta semana", "O que é mais importante nesta disciplina?", "Me teste sobre os temas da pauta"];
      box.append(h("div", { class: "chips" }, sugs.map(function (s) {
        return h("button", { class: "chip", type: "button", onclick: function () { enviarMonitor(ctx, s); } }, s);
      })));
    }

    var inp = h("textarea", { id: "monitor-input", rows: "3", placeholder: "Escreva sua pergunta (Ctrl+Enter envia)", value: chatDraft[ctx] || "", disabled: !sampleFn,
      oninput: function () { chatDraft[ctx] = inp.value; },
      onkeydown: function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); enviarMonitor(ctx, inp.value); } } });
    var limpar = null;
    if (msgs.length && !j) {
      limpar = h("button", { class: "btn ghost small danger", type: "button" }, "Limpar conversa");
      armDelete(limpar, function () { var y = holderFor(ctx); if (y) { y.chat = []; saveHolder(ctx); chatDraft[ctx] = ""; renderMain(true); } });
    }
    box.append(h("label", { class: "field", for: "monitor-input" }, "Sua pergunta", inp),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", disabled: !sampleFn || !!j, onclick: function () { enviarMonitor(ctx, inp.value); } }, "Enviar"),
        j ? h("button", { class: "btn ghost small", type: "button", onclick: function () { stopJob(key); } }, "Parar") : null,
        limpar));
    return box;
  }

  function gerarOrientacao(id) {
    var w = getTrab(id); if (!w) return;
    flushAll();
    startStream("orient:" + id, promptTrabalho(w), function (text, cut) {
      var x = getTrab(id); if (!x) return;
      x.orientacao = text; x.orientacaoCortada = cut;
      if (x.status === "a-fazer" || !x.status) x.status = "andamento";
      persist("trabalhos", x);
    });
  }

  function gerarPerguntas(id) {
    var key = "perg:" + id;
    var t = getTema(id); if (!t || jobs[key] || !sampleFn) return;
    var ctl = new AbortController();
    jobs[key] = { ctl: ctl, text: "" }; delete jobErr[key];
    renderMain(true);
    sampleFn.json(promptPerguntas(t), { signal: ctl.signal, cache: false }).then(function (arr) {
      delete jobs[key];
      var x = getTema(id); if (!x) return;
      var novas = (Array.isArray(arr) ? arr : []).filter(function (q) {
        return q && typeof q.pergunta === "string" && q.pergunta.trim() && typeof q.gabarito === "string";
      }).slice(0, 8).map(function (q) {
        return { id: uid(), tipo: q.tipo === "objetiva" ? "objetiva" : "discursiva", pergunta: q.pergunta.trim(), gabarito: q.gabarito.trim(), resposta: "", nota: null, feedback: "", revelado: false };
      });
      if (!novas.length) { jobErr[key] = copyFor("invalid_json"); return; }
      x.perguntas = (x.perguntas || []).concat(novas);
      persist("temas", x);
    }).catch(function (e) {
      delete jobs[key];
      if (!e || e.code !== "cancelled") jobErr[key] = copyFor(e && e.code);
    }).then(finishUI);

  function corrigir(temaId, qid) {

  function addDias(n) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  /* ---------- tags ---------- */

    /* resumo */
    var running = !!jobs[key];
    var resumo = h("section", { class: "panel stack" }, h("h2", { class: "label", text: "Resumo de revisão" }));
    if (!sampleFn) resumo.append(h("div", { class: "note", text: NO_CLAUDE }));
    if (running || jobErr[key]) resumo.append(jobBox(key, "Montando o resumo…", "Parar"));
    if (!running) {
      if (t.resumo) {
        var rn = h("div", { class: "prose" }); renderMd(t.resumo, rn); resumo.append(rn);
        if (t.resumoCortado) resumo.append(h("div", { class: "note", text: "O resumo foi interrompido antes do fim. Gere de novo para obter a versão completa." }));
      } else {
        resumo.append(h("p", { class: "muted", style: "margin:0", text: "Uma página para reler em poucos minutos, feita a partir do seu guia, das suas anotações e das perguntas em que você foi mal." }));
      }
      resumo.append(h("div", { class: "row" },
        h("button", { class: "btn", type: "button", disabled: !sampleFn, onclick: function () { gerarResumo(id); } }, t.resumo ? "Gerar resumo de novo" : "Gerar resumo de revisão")));
    }
    root.append(resumo);

    /* material já registrado */
    var mat = h("section", { class: "panel stack" }, h("h2", { class: "label", text: "O que você já registrou" }));
    if (t.notas && t.notas.trim()) mat.append(h("div", { class: "stack" }, h("b", { text: "Anotações de aula" }), h("p", { class: "quote", text: t.notas })));
    else mat.append(h("p", { class: "muted", style: "margin:0", text: "Sem anotações de aula neste tema." }));
    if (t.guia) {
      var gn = h("div", { class: "prose" }); renderMd(t.guia, gn);
      mat.append(h("details", { class: "fold" }, h("summary", { text: "Guia de estudo" }), gn));
    } else {
      mat.append(h("p", { class: "muted", style: "margin:0", text: "Este tema ainda não tem guia de estudo." }));
    }
    root.append(mat);

    /* materiais de estudo ligados ao tema */
    var rel = state.materiais.filter(function (m) { return m.temaId === id; });
    if (rel.length) {
      var ms = h("section", { class: "panel stack" }, h("h2", { class: "label", text: "Materiais de estudo deste tema" }));
      rel.forEach(function (m) {
        ms.append(h("div", { class: "rev-row" },
          h("div", null,
            h("a", { class: "mat-link", href: m.url, target: "_blank", rel: "noopener noreferrer" }, m.titulo),
            h("div", { class: "q-meta" }, h("span", { class: "host", text: hostOf(m.url) }))),
          h("a", { class: "btn small", href: m.url, target: "_blank", rel: "noopener noreferrer" }, "Abrir")));
      });
      root.append(ms);
    }

    /* perguntas */
    var ps = t.perguntas || [];
    var pend = ps.filter(precisaRefazer), ok = ps.length - pend.length;
    var perg = h("section", { class: "panel stack" }, h("h2", { class: "label", text: "Perguntas para refazer" }));
    if (!ps.length) {
      perg.append(h("p", { class: "muted", style: "margin:0", text: "Ainda não há perguntas neste tema. Gere as perguntas na aba Perguntas do tema para treinar aqui." }));
    } else {
      perg.append(h("div", { class: "row between" },
        h("span", { class: "muted", text: pend.length ? pend.length + " para refazer · " + ok + " em dia" : "Todas as perguntas estão em dia." }),
        ps.some(function (q) { return q.autoRev; }) ? h("button", { class: "btn ghost small", type: "button", onclick: function () {
          var x = getTema(id); if (!x) return;
          (x.perguntas || []).forEach(function (q) { delete q.autoRev; delete q.revEm; });
          persist("temas", x); renderRail(); renderMain(true);
        } }, "Zerar marcações") : null));
      pend.forEach(function (q) {
        var shown = !!revShown[q.id];
        perg.append(h("article", { class: "q" },
          h("div", { class: "q-meta" },
            h("span", { class: "pill", text: q.tipo }),
            q.nota != null ? h("span", { class: "pill " + (q.nota >= 7 ? "good" : q.nota >= 5 ? "warn" : "bad"), text: "nota anterior " + fmtNota(q.nota) }) : h("span", { class: "pill", text: "ainda não corrigida" }),
            q.autoRev === "errei" ? h("span", { class: "pill bad", text: "marcada como erro" }) : null),
          h("p", { class: "q-text", text: q.pergunta }),
          q.resposta && q.resposta.trim() ? h("div", { class: "fb" }, h("span", { class: "label", style: "margin:0", text: "Sua resposta anterior" }), h("p", { text: q.resposta })) : null,
          !shown
            ? h("div", { class: "row" }, h("button", { class: "btn ghost small", type: "button", onclick: function () { revShown[q.id] = true; renderMain(true); } }, "Mostrar gabarito"))
            : h("div", { class: "stack" },
                h("div", { class: "fb" }, h("span", { class: "label", style: "margin:0", text: "Gabarito" }), h("p", { text: q.gabarito })),
                h("div", { class: "row" },
                  h("span", { class: "muted", text: "Você acertou?" }),
                  h("button", { class: "btn small", type: "button", onclick: function () { delete revShown[q.id]; marcarPergunta(id, q.id, "acertei"); } }, "Acertei"),
                  h("button", { class: "btn ghost small", type: "button", onclick: function () { delete revShown[q.id]; marcarPergunta(id, q.id, "errei"); } }, "Errei")))));
      });
    }
    root.append(perg);

    /* concluir */
    var fim = h("section", { class: "panel stack" }, h("h2", { class: "label", text: "Concluir esta revisão" }),
      h("p", { class: "muted", style: "margin:0", text: "Escolha quando o tema volta para a fila. Temas que você domina podem esperar mais." }));
    fim.append(h("div", { class: "row" }, [[1, "em 1 dia"], [3, "em 3 dias"], [7, "em 7 dias"], [14, "em 14 dias"]].map(function (o) {
      return h("button", { class: o[0] === 3 ? "btn" : "btn ghost", type: "button", onclick: function () {
        var x = getTema(id); if (!x) return;
        x.ultRev = hojeStr(); x.proxRevisao = addDias(o[0]);
        x.revisoes = (x.revisoes || []).concat(Date.now()).slice(-20);
        persist("temas", x);
        select("revhome");
      } }, "Revisei, voltar " + o[1]);
    })));
    root.append(fim);
    return root;
  }

  /* --- trabalho --- */
  function trabView(w) {
    var id = w.id, key = "orient:" + id;
    var root = h("div", { class: "mesa" });

    function upd(fn) { return function () { var x = getTrab(id); if (x) { fn(x); persist("trabalhos", x); renderRail(); } }; }

    var titulo = h("input", { class: "title-input", id: "trab-titulo", type: "text", value: w.titulo, "aria-label": "Título do trabalho",
      oninput: function () { debounced("wt:" + id, upd(function (x) { x.titulo = titulo.value.trim() || "Trabalho sem título"; })); } });
    var del = h("button", { class: "btn ghost small danger", type: "button" }, "Excluir");
    armDelete(del, function () { removeItem("trabalhos", id); state.sel = null; renderRail(); renderMain(true); });

    var prazo = h("input", { id: "trab-prazo", type: "date", value: w.prazo || "",
      onchange: upd(function (x) { x.prazo = prazo.value; }) });
    var status = h("select", { id: "trab-status", onchange: upd(function (x) { x.status = status.value; }) },
      [["a-fazer", "A fazer"], ["andamento", "Em andamento"], ["entregue", "Entregue"]].map(function (o) {
        var op = h("option", { value: o[0], text: o[1] }); if ((w.status || "a-fazer") === o[0]) op.selected = true; return op;
      }));
    var d = daysLeft(w.prazo);

    root.append(h("section", { class: "panel mesa-head" },
      titulo,
      h("div", { class: "row", style: "align-items:flex-end" },
        h("label", { class: "field", for: "trab-prazo", style: "min-width:170px" }, "Prazo de entrega", prazo),
        h("label", { class: "field", for: "trab-status", style: "min-width:170px" }, "Situação", status),
        w.prazo && w.status !== "entregue" ? h("span", { class: "pill " + (d < 0 ? "bad" : d <= 3 ? "warn" : "accent"), text: prazoTexto(d) }) : null),
      h("div", { class: "row between" }, h("span"), del)));

    var enun = h("textarea", { id: "trab-enunciado", rows: "8", value: w.enunciado || "",
      placeholder: "Cole aqui o que o professor pediu: tema, número de páginas, formato, critérios de avaliação, bibliografia indicada…",
      oninput: function () { debounced("we:" + id, upd(function (x) { x.enunciado = enun.value; })); } });

    var orient = h("div", { class: "stack" });
    var running = !!jobs[key];
    if (running || jobErr[key]) orient.append(jobBox(key, "Preparando a orientação…", "Parar"));
    if (!running && w.orientacao) {
      var node = h("div", { class: "prose" }); renderMd(w.orientacao, node); orient.append(node);
      if (w.orientacaoCortada) orient.append(h("div", { class: "note", text: "A orientação foi interrompida antes do fim. Gere de novo para obter a versão completa." }));
    }

    root.append(h("section", { class: "panel stack" },
      h("label", { class: "field", for: "trab-enunciado" }, "Orientação do professor", enun),
      !sampleFn ? h("div", { class: "note", text: NO_CLAUDE }) : null,
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", disabled: !sampleFn || running, onclick: function () { gerarOrientacao(id); } }, w.orientacao ? "Gerar orientação de novo" : "Gerar orientação"),
        h("span", { class: "muted", text: "O monitor orienta o caminho e o cronograma. O texto do trabalho é seu." })),
      orient));
    return root;
  }

  /* ---------- eventos fixos ---------- */
  $("#home-link").addEventListener("click", function () { select(null); });
  $("#rev-link").addEventListener("click", function () { select("revhome"); });
  $("#fab-monitor").addEventListener("click", function () {
    var b = $("#monitor"); if (!b) return;
    b.scrollIntoView({ block: "end" });
    var i = $("#monitor-input"); if (i && !i.disabled) i.focus({ preventScroll: true });
  });
  $("#mat-link").addEventListener("click", function () { state.matEdit = null; select("mat"); });
  $("#mat-add").addEventListener("click", function () {
    state.matEdit = null; select("mat");
    var u = $("#mat-url"); if (u) u.focus();
  });
  $("#novo-trabalho").addEventListener("click", addTrabalho);
  $("#form-temas").addEventListener("submit", function (e) {
    e.preventDefault();
    var ta = $("#novos-temas");
    var n = addTemas(ta.value.split("\n"));
    if (n) { ta.value = ""; select("tema", state.temas[state.temas.length - 1].id); }
  });
  window.addEventListener("pagehide", flushAll);

  /* ---------- inicialização ---------- */
  function ordenar(a, b) { return (a.criadoEm || 0) - (b.criadoEm || 0); }

  function subscribe() {
    var timer = setTimeout(function () {
      if (!state.synced) { state.slow = true; state.loaded = true; renderStatus(); renderRail(); renderMain(false); }
    }, 10000);
    var got = { temas: false, trabalhos: false, materiais: false };
    function ok(col) {
      return function (snap) {
        var list = snap.docs.map(function (d) { var o = JSON.parse(JSON.stringify(d.data() || {})); o.id = d.id; return o; }).sort(ordenar);
        if (col === "temas") state.temas = list; else if (col === "materiais") state.materiais = list; else state.trabalhos = list;
        got[col] = true;
        if (got.temas && got.trabalhos && got.materiais) { state.synced = true; state.loaded = true; state.slow = false; clearTimeout(timer); }
        renderStatus(); renderRail(); renderMain(false);
      };
    }
    function fail() { clearTimeout(timer); state.loaded = true; state.saveError = true; renderStatus(); }
    dbNS.collection("temas").onSnapshot(ok("temas"), fail);
    dbNS.collection("trabalhos").onSnapshot(ok("trabalhos"), fail);
    dbNS.collection("materiais").onSnapshot(ok("materiais"), fail);
    dbNS.collection("conversas").doc("geral").onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null;
      state.geral = { id: "geral", chat: d && Array.isArray(d.chat) ? JSON.parse(JSON.stringify(d.chat)) : [] };
      renderMain(false);
    }, function () {});
    ["temas", "trabalhos", "materiais"].forEach(function (col) {
      dbNS.collection(col).get().then(function (snap) { if (!got[col]) ok(col)(snap); }).catch(function () {});
    });
  }

  function use(name) {
    try { return window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null); }
    catch (e) { return Promise.resolve(null); }
  }

  renderStatus(); renderRail(); renderMain(true);

  Promise.all([use("db").catch(function () { return null; }), use("sample").catch(function () { return null; })]).then(function (r) {
    dbNS = r[0]; sampleFn = r[1];
    if (dbNS) { state.mode = "db"; renderStatus(); subscribe(); }
    else { state.mode = "local"; localLoad(); state.loaded = true; renderStatus(); }
    renderRail(); renderMain(false);
  });
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
